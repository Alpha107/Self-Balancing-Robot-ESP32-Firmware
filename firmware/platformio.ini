; Self-balancing robot firmware (ESP32)
; Pinned to Arduino core 2.x (platform espressif32 6.x) because the
; ledcSetup/ledcAttachPin PWM API used in MotorDriver.cpp was replaced
; with a different signature in core 3.x / platform 7.x+.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
build_flags =
    -D CORE_DEBUG_LEVEL=0
